# AppsOnAir Push backend base URL, exposed as BuildConfig.BASE_URL by push/build.gradle.kts.
# Same layout as the AppLink, AppSync, and Core SDKs. The value is unquoted —
# build.gradle.kts adds the string literal quotes.
# Override per-invocation with -PBASE_URL=...
BASE_URL=https://push.appsonair.com/v1/
